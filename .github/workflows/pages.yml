# Static front-end demo of Taaj on GitHub Pages (no backend: login and live data are unavailable there).
name: Deploy front-end demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/LabStage.Api/wwwroot/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site for /${{ github.event.repository.name }}/
        run: python3 .github/pages/build_pages.py "${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
