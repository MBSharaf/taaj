  <header class="site-header is-scrolled">
    <div class="container bar">
      <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1B47D6"/><path d="M12.5 13.2c2.2-2 4.4-1.6 7.5-.4 3.1-1.2 5.3-1.6 7.5.4 2.4 2.2 1.8 6.4.6 9.7-.9 2.6-1.3 5.6-2.4 7.6-.8 1.4-2.3 1.3-2.8-.3l-1.3-4.6c-.4-1.4-2.8-1.4-3.2 0l-1.3 4.6c-.5 1.6-2 1.7-2.8.3-1.1-2-1.5-5-2.4-7.6-1.2-3.3-1.8-7.5.6-9.7Z" fill="#CFE2FF"/></svg><span>لاب ستيج</span></a>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">الدعم والتواصل</p>
        <h1>تواصل مع فريق لاب ستيج</h1>
        <p class="lede">نساعدك في توثيق المعامل، استفسارات الفواتير، أو حل أي مشكلة تشغيلية.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="card prose-card">
          <div id="contact-alert" class="alert alert-success" hidden>تم استلام رسالتك بنجاح وسيتواصل معك فريق الدعم.</div>
          <form id="contact-form" style="display:grid;gap:var(--sp-3)">
            <div class="field"><label for="c-name">الاسم</label><input class="input" id="c-name" name="name" required></div>
            <div class="field"><label for="c-email">البريد الإلكتروني</label><input class="input input-ltr" id="c-email" name="email" type="email" required></div>
            <div class="field"><label for="c-topic">الموضوع</label>
              <select class="select" id="c-topic" name="topic">
                <option value="verification">توثيق معمل أسنان</option>
                <option value="order">استفسار عن طلب أو مرحلة</option>
                <option value="finance">الفواتير والمدفوعات</option>
                <option value="other">أخرى</option>
              </select>
            </div>
            <div class="field"><label for="c-msg">الرسالة</label><textarea class="textarea" id="c-msg" name="message" required></textarea></div>
            <button class="btn btn-primary" type="submit" style="justify-self:start">إرسال الرسالة</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer-legal"><p>© <span data-year></span> لاب ستيج.</p></div></div></footer>

<script type="module" src="/assets/js/core/site.js?v=7"></script>
  <script type="module">
    document.getElementById('contact-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('contact-alert').hidden = false;
      e.target.reset();
    });
  </script>
<script type="module" src="/assets/js/core/glass.js?v=6"></script>
