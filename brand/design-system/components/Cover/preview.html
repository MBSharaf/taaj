<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taaj</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .brand { fill:var(--primary); }
  .deep { fill:var(--night); }
  .azure { fill:var(--azure); }
  .tint { fill:var(--surface-tint); }
  .aqua { fill:var(--aqua); }
  .blk { rx:var(--radius-lg); }
  .crown { fill:none; stroke-width:8; stroke-linejoin:round; stroke-linecap:round; }
  .crown.on-deep { stroke:var(--aqua); }
  .crown.on-brand { stroke:var(--on-primary); opacity:.9; }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      primary 160×268 slab bled off the top (the brand colour, largest) · night 200×180 · azure 112×80 · surface-tint 200×64 · aqua disc 48 — ≈40% of 960×300
  arrangement one tall cobalt slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters, night block bleeding off the right
  pattern     crown chevrons (literal motif: Taaj = crown): three 3-point crown strokes at a space-6 pitch, cut across the slab and the night block
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; corners radius-lg, the disc radius-pill
-->
<rect class="brand blk" x="16" y="-20" width="160" height="288" rx="22"/>
<rect class="deep blk" x="192" y="88" width="304" height="180" rx="22"/>
<rect class="azure blk" x="192" y="-20" width="112" height="92" rx="22"/>
<rect class="tint blk" x="320" y="8" width="200" height="64" rx="22"/>
<circle class="aqua" cx="248" cy="236" r="16"/>
<polyline class="crown on-brand" points="40,200 64,176 96,208 128,176 152,200"/>
<polyline class="crown on-brand" points="40,232 64,208 96,240 128,208 152,232"/>
<polyline class="crown on-deep" points="296,176 328,144 368,184 408,144 440,176"/>
</svg>
</div>
<div class="words">
<h1 class="name">Taaj</h1>
<p class="tag">تاج — dentists and dental labs, one precise workflow.</p>
</div>
</div>
</body>
</html>
