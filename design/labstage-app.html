<title>Labstage App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root,[data-theme="light"]{--bg:#f4f5f2;--sheet:#ffffff;--raise:#eceee9;--line:#e2e4df;--control:#8a9199;--ink:#14171a;--ink-2:#545c64;--ink-3:#656d75;--primary:#14171a;--on-primary:#ffffff;--accent:#00788c;--design:#2f5bd3;--milling:#6b7684;--layering:#b0601a;--glaze:#0b7a55;--design-tint:#e3e9fb;--design-text:#1f3d99;--milling-tint:#e8eaed;--milling-text:#3d4652;--layering-tint:#f8e7d6;--layering-text:#7a3f0d;--glaze-tint:#dbf0e7;--glaze-text:#0b5c40;--field-design:#1f45b8;--field-milling:#2b3138;--field-layering:#d08a48;--field-glaze:#0f3d30;--field-ink-light:#f2f4f1;--field-ink-dark:#14171a;--success:#1d7a46;--success-tint:#ddf1e4;--warn:#8a5200;--warn-tint:#fbeed6;--danger:#b3261e;--danger-tint:#fbe2df;--float:0 8px 24px rgba(20, 23, 26, 0.16); color-scheme:light}[data-theme="dark"]{--bg:#111213;--sheet:#18191b;--raise:#202224;--line:#26282b;--control:#6c737a;--ink:#eceeef;--ink-2:#a5abb1;--ink-3:#8f969c;--primary:#eceeef;--on-primary:#111213;--accent:#22d3ee;--design:#7c9dff;--milling:#a7b2bf;--layering:#f2a65a;--glaze:#3fd69a;--design-tint:#1c2540;--design-text:#b9caff;--milling-tint:#25292e;--milling-text:#c9d1da;--layering-tint:#3a2716;--layering-text:#f8c58f;--glaze-tint:#123326;--glaze-text:#8fe8c0;--success:#4ade80;--success-tint:#14301f;--warn:#f5c060;--warn-tint:#3a2e14;--danger:#ff8a7d;--danger-tint:#3d1d1a;--float:0 8px 24px rgba(0, 0, 0, 0.5); color-scheme:dark}:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-xl:12px;--radius-pill:11px;--sidebar-width:232px;--rail-width:340px;--row-height:44px;--control-height:36px;--font-title:"Sora", "IBM Plex Sans Arabic", system-ui, sans-serif;--font-text:"IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;}
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap");

/* Labstage system components. Every value comes from tokens.css. */
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.ls-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ls-icon { flex: none; display: block; }
.ls-mono { font-family: var(--font-mono); font-size: 13px; }
:where(.ls-btn, .ls-tooth, .ls-rowlink, .ls-note, .ls-side a, .ls-input):focus-visible, .ls-shade input:focus-visible + span, .ls-chat input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ls-panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
.ls-panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px var(--space-5) 10px; }
.ls-panel > header h2 { margin: 0; font: 600 15px/20px var(--font-text); }
.ls-panel > header span { font-size: 13px; color: var(--ink-2); }

/* AppShell */
.ls-app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; background: var(--bg); color: var(--ink); }
.ls-side { position: sticky; top: 0; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; padding: 18px 12px; border-inline-end: 1px solid var(--line); }
.ls-brand { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.ls-brand b { font: 700 19px/1 var(--font-title); letter-spacing: -0.03em; }
.ls-brand span { font-size: 12px; color: var(--ink-2); }
.ls-side nav { display: flex; flex-direction: column; gap: 2px; }
.ls-grp { font-size: 12px; color: var(--ink-3); padding: 0 10px 6px; }
.ls-side nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); }
.ls-side nav a:hover { color: var(--ink); background: var(--raise); }
.ls-side nav a[aria-current="page"] { color: var(--ink); background: var(--raise); font-weight: 500; }
.ls-count { margin-inline-start: auto; font-size: 12px; color: var(--ink); }
.ls-side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.ls-me { display: flex; align-items: center; gap: 10px; padding: 6px; }
.ls-me i { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 600 12px/1 var(--font-text); font-style: normal; }
.ls-me small { display: block; font-size: 12px; color: var(--ink-2); }
.ls-main { min-width: 0; padding: 28px var(--space-8) 64px; }
@media (max-width: 760px) {
  .ls-app { grid-template-columns: 1fr; }
  .ls-side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-inline-end: 0; border-bottom: 1px solid var(--line); padding: 12px var(--space-4); }
  .ls-side nav { flex-direction: row; flex-wrap: wrap; width: 100%; order: 3; }
  .ls-grp, .ls-me { display: none; }
  .ls-side-foot { margin: 0; margin-inline-start: auto; }
  .ls-main { padding: 20px var(--space-4) 48px; }
}

/* Button */
.ls-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 14px; border-radius: var(--radius-md); border: 1px solid var(--control); background: var(--sheet); color: var(--ink); font: 500 14px/1 var(--font-text); text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform .12s, background-color .15s, opacity .15s; }
.ls-btn:hover { background: var(--raise); }
.ls-btn:active { transform: scale(.98); }
.ls-btn--primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.ls-btn--primary:hover { background: var(--primary); opacity: .88; }
.ls-btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.ls-btn--ghost:hover { color: var(--ink); background: var(--raise); }
.ls-btn--danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.ls-btn--sm { height: 30px; padding: 0 10px; font-size: 13px; }
.ls-btn:disabled { opacity: .45; cursor: not-allowed; }

/* Field */
.ls-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ls-field label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.ls-input { height: var(--control-height); box-sizing: border-box; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--control); background: var(--sheet); color: var(--ink); font: 400 14px/1.4 var(--font-text); min-width: 0; }
textarea.ls-input { height: auto; padding: 10px 12px; resize: vertical; }
.ls-input::placeholder { color: var(--ink-3); }
.ls-field-msg { font-size: 13px; color: var(--ink-2); }
.ls-field.is-error .ls-input { border-color: var(--danger); }
.ls-field.is-error .ls-field-msg { color: var(--danger); }

/* Pills, strip */
.ls-pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--raise); color: var(--ink-2); }
.ls-pill--design { background: var(--design-tint); color: var(--design-text); }
.ls-pill--milling { background: var(--milling-tint); color: var(--milling-text); }
.ls-pill--layering { background: var(--layering-tint); color: var(--layering-text); }
.ls-pill--glaze { background: var(--glaze-tint); color: var(--glaze-text); }
.ls-pill--success { background: var(--success-tint); color: var(--success); }
.ls-pill--warn { background: var(--warn-tint); color: var(--warn); }
.ls-pill--danger { background: var(--danger-tint); color: var(--danger); }
.ls-strip { display: inline-grid; grid-template-columns: repeat(4, 18px); gap: 3px; vertical-align: middle; }
.ls-strip i { height: 6px; border-radius: 1px; background: var(--line); }
.ls-strip i.skip { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.ls-c-design { background: var(--design) !important; } .ls-c-milling { background: var(--milling) !important; } .ls-c-layering { background: var(--layering) !important; } .ls-c-glaze { background: var(--glaze) !important; }
.ls-stagecell { display: inline-flex; align-items: center; gap: 10px; }

/* StageTracker */
.ls-tracker { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.ls-tracker li { display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-width: 0; }
.ls-tracker .bar { height: 6px; border-radius: 2px; background: currentColor; opacity: .25; }
.ls-tracker .is-done .bar, .ls-tracker .is-now .bar { opacity: 1; }
.ls-tracker .is-now .bar { box-shadow: 0 0 0 2px var(--fld, var(--sheet)), 0 0 0 4px currentColor; }
.ls-tracker b { font-weight: 600; }
.ls-tracker small { opacity: .82; font-size: 12px; }

/* CrownStage */
.ls-crown { position: relative; width: 100%; aspect-ratio: 1 / 1; display: grid; place-items: center; color: currentColor; }
.ls-crown canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.ls-crown-fb { width: 50%; height: 50%; }
.ls-crown.is-3d .ls-crown-fb { display: none; }

/* CaseHeader */
.ls-case-head { --fld: var(--field-design); display: grid; grid-template-columns: minmax(0, 1fr) 300px; border-radius: var(--radius-xl); overflow: hidden; background: var(--fld); color: var(--field-ink-light); }
.ls-case-head.ls-field-milling { --fld: var(--field-milling); }
.ls-case-head.ls-field-layering { --fld: var(--field-layering); color: var(--field-ink-dark); }
.ls-case-head.ls-field-glaze { --fld: var(--field-glaze); }
.ls-case-head .info { padding: var(--space-6); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ls-case-head .top { opacity: .82; }
.ls-case-head h1 { margin: 0; font: 600 30px/34px var(--font-title); letter-spacing: -0.02em; }
.ls-case-head .meta { font-size: 14px; opacity: .88; margin-top: 4px; }
.ls-case-head .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.ls-case-head .acts .ls-btn { background: transparent; color: inherit; border-color: currentColor; }
.ls-case-head .acts .ls-btn:hover { background: rgba(255, 255, 255, .14); }
.ls-case-head .crown { aspect-ratio: auto; min-height: 260px; }
@media (max-width: 900px) { .ls-case-head { grid-template-columns: 1fr; } }

/* KpiStrip */
.ls-kpis { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.ls-kpis > div { padding: 14px var(--space-5); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ls-kpis > div + div { border-inline-start: 1px solid var(--line); }
.ls-kpis span { font-size: 13px; color: var(--ink-2); }
.ls-kpis b { font: 500 24px/28px var(--font-text); }
.ls-kpis b.lead { font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: -0.01em; }
.ls-kpis small { font-size: 12px; color: var(--ink-3); }
@media (max-width: 760px) { .ls-kpis { grid-template-columns: 1fr 1fr; } .ls-kpis > div + div { border-inline-start: 0; } .ls-kpis > div:nth-child(n+3) { border-top: 1px solid var(--line); } .ls-kpis > div:nth-child(even) { border-inline-start: 1px solid var(--line); } }

/* Tables */
.ls-table-wrap { overflow-x: auto; }
.ls-table { width: 100%; border-collapse: collapse; }
.ls-table th { font-size: 12px; font-weight: 500; color: var(--ink-3); text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ls-table td { padding: 11px 12px; height: var(--row-height); border-bottom: 1px solid var(--line); vertical-align: middle; }
.ls-table tr:last-child td { border-bottom: 0; }
.ls-table th:first-child, .ls-table td:first-child { padding-inline-start: var(--space-5); }
.ls-table th:last-child, .ls-table td:last-child { padding-inline-end: var(--space-5); }
.ls-table .num { text-align: end; }
.ls-table .sub { display: block; font-size: 12px; color: var(--ink-2); }
.ls-table tr.link { cursor: pointer; }
.ls-table tr.link:hover td { background: var(--raise); }
.ls-table tfoot td { font-weight: 600; border-top: 1px solid var(--control); border-bottom: 0; }
.ls-rowlink { border: 0; padding: 0; background: none; color: var(--ink); font: 500 14px/1.4 var(--font-text); cursor: pointer; text-align: start; }

/* ActionQueue */
.ls-queue { display: flex; flex-direction: column; }
.ls-qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px var(--space-5); min-height: var(--row-height); border-top: 1px solid var(--line); }
.ls-qrow .what { flex: 1 1 260px; min-width: 0; }
.ls-qrow .what b { font-weight: 500; }
.ls-qrow .what span { display: block; font-size: 13px; color: var(--ink-2); }
.ls-qrow .amt { font-weight: 600; }
.ls-empty { margin: 0; padding: 12px var(--space-5); font-size: 13px; color: var(--ink-2); }

/* KanbanBoard */
.ls-board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; min-width: 920px; }
.ls-lane { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ls-lane h2 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 2px 4px 6px; font: 600 14px/20px var(--font-text); }
.ls-lane h2 i { width: 10px; height: 10px; border-radius: 50%; }
.ls-lane h2 span { margin-inline-start: auto; color: var(--ink-3); font-weight: 400; }
.ls-lane .ls-empty { padding: 8px 4px; }
.ls-kcard { background: var(--raise); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; border-inline-start: 3px solid var(--design); }
.ls-edge-milling { border-inline-start-color: var(--milling); } .ls-edge-layering { border-inline-start-color: var(--layering); } .ls-edge-glaze { border-inline-start-color: var(--glaze); }
.ls-kcard b { font-weight: 500; }
.ls-kcard .sub { font-size: 12px; color: var(--ink-2); }
.ls-kcard .act { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }

/* ToothChart */
.ls-teeth { display: flex; flex-direction: column; align-items: center; gap: 6px; overflow-x: auto; padding: 6px 0; }
.ls-teeth .trow { display: flex; gap: 4px; }
.ls-teeth .mid { width: 100%; max-width: 640px; height: 1px; background: var(--line); }
.ls-tooth { height: 40px; padding: 0; border-radius: 4px 4px 9px 9px; border: 1px solid var(--control); background: var(--bg); color: var(--ink); font: 500 12px/1 var(--font-mono); cursor: pointer; transition: transform .12s, background-color .12s; }
.ls-tooth.lower { border-radius: 9px 9px 4px 4px; }
.ls-tooth:hover { transform: translateY(-2px); }
.ls-tooth[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ls-tooth:disabled { cursor: default; transform: none; }
.ls-teeth .sum { display: flex; gap: 12px; align-items: baseline; align-self: stretch; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.ls-teeth .sum .ls-mono { color: var(--ink-2); }

/* ShadePicker */
.ls-shades { display: flex; flex-wrap: wrap; gap: 6px; }
.ls-shade { position: relative; }
.ls-shade input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.ls-shade span { display: grid; align-items: end; justify-items: center; width: 40px; height: 56px; padding-bottom: 6px; box-sizing: border-box; border-radius: 4px 4px 16px 16px; background: var(--c); color: #2a241b; font: 600 11px/1 var(--font-text); cursor: pointer; transition: transform .12s; }
.ls-shade input:checked + span { transform: translateY(-5px); box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--ink); }

/* OrderSummary */
.ls-summary { display: flex; flex-direction: column; gap: 14px; }
.ls-summary dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
.ls-summary dt { color: var(--ink-2); }
.ls-summary dd { margin: 0; text-align: end; }
.ls-summary .tot { color: var(--ink); font-weight: 600; padding-top: 10px; border-top: 1px solid var(--line); }
.ls-summary .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; }
.ls-summary .halves div { background: var(--raise); padding: 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); }
.ls-summary .halves b { font-size: 18px; font-weight: 600; color: var(--ink); }

/* CaseChat */
.ls-chat { display: flex; flex-direction: column; height: 100%; min-height: 360px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.ls-chat header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px var(--space-5) 10px; }
.ls-chat header h2 { margin: 0; font: 600 15px/20px var(--font-text); }
.ls-chat header .sub { font-size: 13px; color: var(--ink-2); }
.ls-chat .log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px var(--space-5) 14px; display: flex; flex-direction: column; gap: 12px; }
.ls-chat .msg { max-width: 86%; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.ls-chat .msg.mine { align-self: flex-end; align-items: flex-end; }
.ls-chat .bub { padding: 9px 12px; border-radius: 10px; background: var(--raise); }
.ls-chat .mine .bub { background: var(--ink); color: var(--bg); }
.ls-chat small { font-size: 11px; color: var(--ink-3); }
.ls-chat .file { display: flex; gap: 8px; align-items: center; margin-top: 6px; padding: 7px 9px; border-radius: 6px; background: var(--sheet); color: var(--ink); }
.ls-chat .ev { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.ls-chat .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.ls-chat .composer input { flex: 1; min-width: 0; height: var(--control-height); padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--control); background: var(--bg); color: var(--ink); font: inherit; }
[dir="rtl"] .ls-chat .composer .ls-icon { transform: scaleX(-1); }

/* LabRow */
.ls-labrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 14px var(--space-5); border-top: 1px solid var(--line); }
.ls-labrow .mk { width: 44px; height: 44px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 600 15px/1 var(--font-title); }
.ls-labrow b { font-weight: 500; margin-inline-end: 8px; }
.ls-labrow .sub { display: block; font-size: 13px; color: var(--ink-2); }
.ls-labrow .rate { text-align: end; }
.ls-labrow .rate b { font-size: 16px; font-weight: 600; margin: 0; }
.ls-labrow .rate small { display: block; font-size: 12px; color: var(--ink-2); }
@media (max-width: 600px) { .ls-labrow { grid-template-columns: 44px minmax(0, 1fr) auto; } .ls-labrow .ls-btn { grid-column: 2 / -1; justify-self: start; } }

/* Notification */
.ls-note { display: flex; gap: 12px; align-items: flex-start; width: 100%; box-sizing: border-box; padding: 12px var(--space-5); border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); text-align: start; font: inherit; }
button.ls-note { cursor: pointer; }
button.ls-note:hover { background: var(--raise); }
.ls-note .ls-icon { margin-top: 3px; color: var(--ink-2); }
.ls-note .what { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ls-note .what b { font-weight: 400; }
.ls-note.is-unread .what b { font-weight: 600; }
.ls-note .what span { font-size: 13px; color: var(--ink-2); }
.ls-note .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; color: var(--ink-3); }
.ls-note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

@media (prefers-reduced-motion: reduce) { .ls-btn, .ls-tooth, .ls-shade span { transition: none; } }

/* Page layout for the Labstage prototype. Values come from the design system tokens. */
.pg-top { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
.pg-search { position: relative; flex: 1 1 auto; max-width: 560px; display: flex; align-items: center; gap: 8px; height: var(--control-height); padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--control); background: var(--sheet); color: var(--ink-2); }
.pg-search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.pg-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 14px/1 var(--font-text); }
.pg-search input::placeholder { color: var(--ink-3); }
.pg-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--float); overflow: hidden; }
